# Render Blueprint — Docker deployment for the UniRide UniStay stack.
#
# Deploy: push this repo to GitHub, then Render Dashboard → New → Blueprint →
# select the repo (it reads render.yaml) → Apply.
#
# One service runs the whole stack: the Express API, /uploads and the Next.js
# web app behind nginx on the same origin. The database is Supabase; DATABASE_URL
# is not stored here. Set it in the Render dashboard to the Supabase session-pooler
# URL (port 5432) with the password URL-encoded. SSL is enabled by DATABASE_SSL=true.
#
# If Render renames the service, update the three public URLs below.

services:
  - type: web
    name: uniride-unistay
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://uniride-unistay.onrender.com
      - key: PUBLIC_API_URL
        value: https://uniride-unistay.onrender.com
      # Same origin as the web app. Build-time value: changing it needs a redeploy.
      - key: NEXT_PUBLIC_API_URL
        value: https://uniride-unistay.onrender.com
    # Free instances have an ephemeral filesystem: uploaded images disappear on
    # every deploy/restart. On a paid plan uncomment this disk (owned by /app/uploads):
    # disk:
    #   name: uniride-uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1
